[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memlet"
version = "8.4.0"
description = "Memlet (formerly Ieum Memory / DeltaHarness / PRISM Memory) — code-anchored agent memory: zero-daemon init, AST-anchored Markdown wiki, instruction drift checker, bitemporal skill engine & VibeRescue kit"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "DeltaHarness Architecture Team"}
]
dependencies = []

[project.optional-dependencies]
semantic = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "tokenizers>=0.15",
]

[project.scripts]
memlet = "memory_cli:cli"
memlet-mcp = "prism_memory_mcp:main"
ieum-memory = "memory_cli:cli"
ieum-memory-mcp = "prism_memory_mcp:main"
prism-memory = "memory_cli:cli"
prism-memory-mcp = "prism_memory_mcp:main"
deltaharness = "memory_cli:cli"
deltaharness-mcp = "prism_memory_mcp:main"
viberescue = "prism_memory.viberescue:cli"
anti-slop = "prism_memory.anti_slop:cli"


[tool.setuptools]
packages = ["prism_memory"]
py-modules = [
    "work_memory",
    "memory_vectors",
    "memory_skills",
    "memory_intelligence",
    "memory_cli",
    "prism_memory_mcp",
]

[tool.setuptools.package-data]
prism_memory = ["persona-canon.json", "js_env_refs.cjs"]
